    <h2>Playbook</h2>
    <h1>Three plays</h1>
    <ol class="steps">
      <li><strong>Tier the models.</strong> Match model and effort to the job — not the most capable setting by default.</li>
      <li><strong>Pool the spend.</strong> One visible number your team can see, not N invisible personal ones.</li>
      <li><strong>Codify the top loops.</strong> Demo 1 → Demo 2 — pinned, versioned, gated.</li>
